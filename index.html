<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balentayms</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="floating-hearts" id="floatingHearts"></div>
    <div class="main">
        <input type="checkbox" id="chk" aria-hidden="true">
        <div class="signup">
            <form>
                <label for="chk" aria-hidden="true"></label>
                <!-- <input type="text" name="txt" placeholder="Username" required="">
                <input type="email" name="email" placeholder="Email" required="">
                <input type="password" name="pswd" placeholder="Password" required="">
                <button>Sign Up</button> -->
            </form>
        </div>

        <div class="login">
            <form>
                <label for="chk" aria-hidden="true">
                    <span>L</span><span>o</span><span>g</span><span>i</span><span>n</span>
                </label>
                <div class="input-container">
                    <input type="text" id="username" name="username" placeholder="Enter Username" required>
                    <span class="hint">Your BF's favorite color + Favorite Food</span>
                </div>
                <div class="input-container">
                    <input type="password" name="password" placeholder="Password" required="">
                    <span class="hint">Your favorite color + Anniversary Date (MM/DD/YYYY)</span>
                </div>
                <button>Login</button>
            </form>
        </div>

        <!-- Wrong Password Modal -->
        <div id="wrongModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <img src="images/angrycat.gif" alt="Wrong Password">
                <p>Mali ka boi!<p>
            </div>
        </div>
    </div>

 <script src="js/login.js"></script>
</body>
</html>
